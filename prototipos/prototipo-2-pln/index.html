<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protótipo 2 — Motor de PLN Leve & Extração de Slots | TCC Marília Stefenon</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Shared Theme -->
  <link rel="stylesheet" href="../shared/chat-theme.css">
  
  <!-- PDF-Lib & Download.js -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/downloadjs/1.4.8/download.min.js"></script>
</head>
<body>

  <!-- Header Superior -->
  <header class="prototype-header">
    <div class="prototype-title">
      <a href="../../index.html" style="color: var(--text-muted); text-decoration: none; font-size: 1.25rem;"><i class="bi bi-arrow-left-circle"></i></a>
      <span class="prototype-badge badge-p2">Protótipo 2 • Com PLN Leve</span>
      <h1 style="font-size: 1.1rem; font-weight: 700;">Chatbot Secretaria — Intent Classification & Entity Extraction</h1>
    </div>
    <div style="display: flex; gap: 0.5rem;">
      <a href="../prototipo-1-lexical/index.html" class="btn-switch-user" style="text-decoration: none;">&larr; P1 (Lexical)</a>
      <a href="../prototipo-3-llm/index.html" class="btn-switch-user" style="text-decoration: none;">Ir para P3 (LLM) &rarr;</a>
      <a href="../painel-secretaria/index.html" class="btn-switch-user" style="text-decoration: none; color: var(--ifsc-green-light);"><i class="bi bi-person-badge"></i> Painel do Ramon</a>
    </div>
  </header>

  <!-- Barra de Reconhecimento do Usuário (Sessão Persistente) -->
  <div class="user-bar">
    <div id="user-status-container">
      <span class="user-status-anonymous"><i class="bi bi-incognito"></i> Aluno não identificado</span>
    </div>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <span style="color: var(--text-muted); font-size: 0.75rem;">Simular Perfil:</span>
      <button class="btn-switch-user" onclick="simularLogin('20241010045')">Mariana (SPI)</button>
      <button class="btn-switch-user" onclick="simularLogin('20251010088')">Beatriz (ADM)</button>
      <button class="btn-switch-user" onclick="simularLogout()"><i class="bi bi-x-circle"></i> Sair</button>
    </div>
  </div>

  <!-- Container do Chat -->
  <div class="chat-container">
    <div class="chat-card">
      
      <!-- Caixa de Mensagens -->
      <div class="messages-box" id="chat-messages">
        <!-- Mensagens inseridas via JS -->
      </div>

      <!-- Inspector Técnico de PLN (Exibição em tempo real de Intenções e Entidades) -->
      <div class="debug-panel" style="flex-direction: column; align-items: flex-start; gap: 0.35rem;">
        <div style="display: flex; justify-content: space-between; width: 100%;">
          <span><i class="bi bi-cpu-fill"></i> Motor PLN: <strong>Cosine Similarity + TF-IDF Vectorizer</strong></span>
          <span id="pln-confidence" style="color: var(--accent-purple); font-weight: 600;">Confiança: --</span>
        </div>
        <div id="pln-details" style="font-size: 0.75rem; color: var(--text-muted);">
          Intenção: <span style="color: var(--text-main);">Nenhuma</span> | Entidades detectadas: <span style="color: var(--text-main);">Nenhuma</span>
        </div>
      </div>

      <!-- Sugestões Rápidas de Frases Naturais e Atalhos Numéricos -->
      <div class="quick-replies-container" id="quick-replies">
        <button class="btn-chip" onclick="handleQuickReply('1')"><i class="bi bi-file-earmark-pdf"></i> [1] Declaração</button>
        <button class="btn-chip" onclick="handleQuickReply('2')"><i class="bi bi-exclamation-triangle"></i> [2] Pendências</button>
        <button class="btn-chip" onclick="handleQuickReply('3')"><i class="bi bi-card-checklist"></i> [3] Status Pedidos</button>
        <button class="btn-chip" onclick="handleQuickReply('8')"><i class="bi bi-person-headset"></i> [8] Atendente</button>
        <button class="btn-chip" onclick="handleQuickReply('0')"><i class="bi bi-house-door"></i> [0] Início</button>
        <button class="btn-chip" onclick="handleQuickReply('9')"><i class="bi bi-box-arrow-right"></i> [9] Sair</button>
      </div>

      <!-- Área de Digitação -->
      <div class="input-area">
        <input type="text" id="user-input" class="input-field" placeholder="Escreva sua pergunta naturalmente em português..." autocomplete="off">
        <button id="btn-send" class="btn-send" onclick="sendMessage()"><i class="bi bi-send-fill"></i></button>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="../shared/sigaa-mock.js"></script>
  <script src="nlp-engine.js"></script>
</body>
</html>
